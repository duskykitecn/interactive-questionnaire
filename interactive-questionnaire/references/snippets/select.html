<div class="field" data-field="<FIELD_ID>" data-type="select" data-label="<QUESTION_LABEL>">
  <div class="fhead"><span class="htitle"><span class="name"><QUESTION_LABEL></span><span class="ctype">select</span></span></div>
  <div class="fbody">
    <div class="qdesc"><QUESTION_DESC></div>
    <div class="primary"><div class="mlist single" role="radiogroup" aria-label="<QUESTION_LABEL>">
      <div class="mrow" aria-pressed="false"><span class="check"></span><span class="mlabel"><OPTION_1></span></div>
      <div class="mrow" aria-pressed="true"><span class="check"></span><span class="mlabel"><OPTION_2></span></div>
      <div class="mrow" aria-pressed="false"><span class="check"></span><span class="mlabel"><OPTION_3></span></div>
    </div></div>
    <div class="cust"><button class="cust-toggle">＋ 改用文字填写</button><div class="reveal cust-reveal"><input type="text" class="cust-input" placeholder="<CUSTOM_PLACEHOLDER>"></div></div>
  </div>
</div>
<!-- 单选、选项较多（滚动圆选列表）。每行一个选项；恰好一个 aria-pressed="true"。 -->
