<div class="field" data-field="<FIELD_ID>" data-type="stepper" data-suffix="<SUFFIX>" data-min="<MIN>" data-max="<MAX>" data-label="<QUESTION_LABEL>">
  <div class="fhead"><span class="htitle"><span class="name"><QUESTION_LABEL></span><span class="ctype">stepper</span></span></div>
  <div class="fbody">
    <div class="qdesc"><QUESTION_DESC></div>
    <div class="primary"><div class="stepper"><button type="button" data-step="-1" aria-label="减少">−</button><input class="num" type="text" inputmode="numeric" value="<VALUE>" aria-label="<QUESTION_LABEL>"><button type="button" data-step="1" aria-label="增加">+</button></div></div>
    <div class="cust"><button class="cust-toggle">＋ 改用文字填写</button><div class="reveal cust-reveal"><input type="text" class="cust-input" placeholder="<CUSTOM_PLACEHOLDER>"></div></div>
  </div>
</div>
<!-- 小整数计数：data-min/data-max 夹取范围；value=预选默认值；中间数字可直接键入。data-suffix（如" 晚"）可省。 -->
