<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t d">
  <title id="t">Without this skill</title>
  <desc id="d">Eight questions sit inside one long agent reply. You have to finish reading before you know what you were asked.</desc>
  <defs>
    <filter id="cardSh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1A2330" flood-opacity=".1"/>
    </filter>
    <filter id="stickySh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="4" stdDeviation="3" flood-color="#8A5A12" flood-opacity=".28"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="#D8DCE6"/>
  <rect x="28" y="20" width="744" height="560" rx="14" fill="#F7F8FC" stroke="#C5CAD6" filter="url(#cardSh)"/>

  <text x="52" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#1A2330">Without this skill</text>
  <text x="52" y="74" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#5B6675">Questions hide in one long reply. Skim it and you miss some.</text>

  <rect x="52" y="106" width="32" height="32" rx="10" fill="#4B57D6"/>
  <text x="68" y="127" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff">A</text>
  <text x="92" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8A94A3">Agent</text>

  <path fill="#ECEEFB" d="M92 122h628a12 12 0 0 1 12 12v230a12 12 0 0 1-12 12H108l-16 10V134a12 12 0 0 1 12-12z"/>

    <text x="108" y="152" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan>Sure, I&apos;ll sketch a trip and you can correct me. Rooms and tables all</tspan></text>
    <text x="108" y="170" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan>hinge on this -- </tspan><tspan stroke="#F2D24A" stroke-width="11" paint-order="stroke fill" stroke-linejoin="round" stroke-linecap="round">how many people are actually going?</tspan><tspan> I shouldn&apos;t</tspan></text>
    <text x="108" y="188" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan>default to two. Transport isn&apos;t locked; trains and flights differ a</tspan></text>
    <text x="108" y="206" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan>lot. </tspan><tspan stroke="#F2D24A" stroke-width="11" paint-order="stroke fill" stroke-linejoin="round" stroke-linecap="round">Is leaving from Shanghai OK?</tspan><tspan> Another city only changes the hours.</tspan></text>
    <text x="108" y="224" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan>I&apos;m guessing on the vibe: </tspan><tspan stroke="#F2D24A" stroke-width="11" paint-order="stroke fill" stroke-linejoin="round" stroke-linecap="round">is this about food and scenery, or more</tspan></text>
    <text x="108" y="242" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan stroke="#F2D24A" stroke-width="11" paint-order="stroke fill" stroke-linejoin="round" stroke-linecap="round">shopping and nightlife?</tspan><tspan> Activities are even less settled. Hot springs,</tspan></text>
    <text x="108" y="260" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan stroke="#F2D24A" stroke-width="11" paint-order="stroke fill" stroke-linejoin="round" stroke-linecap="round">hiking, or a theme park?</tspan><tspan> Oh, and </tspan><tspan stroke="#F2D24A" stroke-width="11" paint-order="stroke fill" stroke-linejoin="round" stroke-linecap="round">do you need invoices?</tspan><tspan> If this is</tspan></text>
    <text x="108" y="278" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan>reimbursement I&apos;ll filter hotels that can issue them. Pace I&apos;ll call</tspan></text>
    <text x="108" y="296" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan>moderate. Budget I don&apos;t know -- </tspan><tspan stroke="#F2D24A" stroke-width="11" paint-order="stroke fill" stroke-linejoin="round" stroke-linecap="round">is 800 a day per person enough?</tspan><tspan> Is</tspan></text>
    <text x="108" y="314" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan stroke="#F2D24A" stroke-width="11" paint-order="stroke fill" stroke-linejoin="round" stroke-linecap="round">600-1500 a night for the hotel OK?</tspan><tspan> I won&apos;t go higher unless you say</tspan></text>
    <text x="108" y="332" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan>so. Two nights and done, </tspan><tspan stroke="#F2D24A" stroke-width="11" paint-order="stroke fill" stroke-linejoin="round" stroke-linecap="round">or do you want extra days off?</tspan><tspan> I&apos;ll call you</tspan></text>
    <text x="108" y="350" font-size="13" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" fill="#1A2330"><tspan>Alex; allergies in one line is enough.</tspan></text>

  <g transform="rotate(-7 690 86)" filter="url(#stickySh)">
    <rect x="618" y="28" width="136" height="122" rx="2" fill="#F6C445"/>
    <rect x="618" y="28" width="136" height="7" fill="#E8B03A"/>
    <text x="686" y="78" text-anchor="middle" font-family="Georgia,'Songti SC','Times New Roman',serif" font-size="36" font-weight="700" fill="#7A3E0C">8</text>
    <text x="686" y="100" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#7A3E0C">questions in here</text>
    <text x="686" y="118" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9A5A16">all in this reply</text>
    <text x="686" y="134" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9A5A16">one here, one there</text>
    <path d="M640 36c22-8 40-5 60 3" fill="none" stroke="#F4E7C2" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  </g>

  <rect x="52" y="404" width="32" height="32" rx="10" fill="#3D4654"/>
  <text x="68" y="425" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff">You</text>
  <text x="92" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#8A94A3">Your reply</text>

  <path fill="#EEF0F4" d="M92 420h520a12 12 0 0 1 12 12v56a12 12 0 0 1-12 12H108l-16 10V432a12 12 0 0 1 12-12z"/>
  <text x="108" y="450" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#1A2330">two people I guess, shanghai, budget depends, invoices</text>
  <text x="108" y="470" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#1A2330">you figure out, skip hot springs, any name is fine...</text>
  <path d="M108 484q18 5 36 0t36 0t36 0t36 0t36 0t36 0t36 0t36 0" fill="none" stroke="#D6453C" stroke-width="1.4" stroke-linecap="round" opacity=".6"/>

  <text x="52" y="548" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#5B6675">You type a paragraph back. Hard to tell which of the eight you actually answered.</text>
</svg>
