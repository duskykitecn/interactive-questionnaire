# push 到 main 时：构建演示站并推到组织 static 总仓（只改本项目演示页，不动 releases/）。
# 本仓库的 GitHub Pages 仍由仓库根 index.html 随 main 自动发布，无需本工作流。
# 总仓同步默认关闭。启用方法见 PUBLISHING.md「静态托管」：
#   Secrets: STATIC_DEPLOY_TOKEN（只授 duskykitecn/static 写权限的 PAT，不要贴进对话）
#   Variables: STATIC_DEPLOY_ENABLED=true
#             STATIC_REPO=duskykitecn/static   （可改，须与总仓一致）
# 未打开开关时 static-hub 任务直接跳过。
name: Deploy demo site

on:
  push:
    branches: [main]
    paths:
      - interactive-questionnaire/assets/demo.html
      - scripts/build_site.py
      - .github/workflows/deploy-site.yml
  workflow_dispatch:

concurrency:
  group: deploy-demo-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 构建演示站
        run: python scripts/build_site.py

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/site
          retention-days: 7

  static-hub:
    needs: build
    if: ${{ vars.STATIC_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/site

      - name: 检出 static 总仓
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.STATIC_REPO != '' && vars.STATIC_REPO || 'duskykitecn/static' }}
          token: ${{ secrets.STATIC_DEPLOY_TOKEN }}
          path: static-hub

      - name: 只更新本项目演示页并推送
        working-directory: static-hub
        env:
          PROJECT_SLUG: interactive-questionnaire
        run: |
          set -euo pipefail
          src="../dist/site/${PROJECT_SLUG}"
          test -f "${src}/index.html"
          test -f "${src}/assets/demo.html"
          mkdir -p "${PROJECT_SLUG}/assets"
          cp "${src}/index.html" "${PROJECT_SLUG}/index.html"
          cp "${src}/assets/demo.html" "${PROJECT_SLUG}/assets/demo.html"
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${PROJECT_SLUG}/index.html" "${PROJECT_SLUG}/assets/demo.html" .nojekyll
          if git diff --cached --quiet; then
            echo "总仓中 ${PROJECT_SLUG}/ 演示页无变化，跳过推送"
            exit 0
          fi
          git commit -m "chore: update ${PROJECT_SLUG} demo"
          git push
